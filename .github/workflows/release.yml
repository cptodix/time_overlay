name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

# Prevent two release runs from racing for the same next version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Calculate next version
    runs-on: ubuntu-22.04
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        shell: bash
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail

          # Make sure every remote tag is available locally.
          git fetch --tags --force --quiet

          latest="$(
            git tag --list 'v*' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n1 \
              || true
          )"
          if [ -z "$latest" ]; then
            latest="v0.0.0"
          fi

          version="${latest#v}"
          IFS=. read -r major minor patch <<< "$version"

          case "$RELEASE_TYPE" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unknown release type: $RELEASE_TYPE" >&2
              exit 1
              ;;
          esac

          new_tag="v${major}.${minor}.${patch}"
          {
            echo "new_tag=$new_tag"
            echo "new_version=${major}.${minor}.${patch}"
          } >> "$GITHUB_OUTPUT"
          echo "Latest tag: $latest"
          echo "Next tag: $new_tag"

  test:
    name: Tests
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  windows:
    name: Windows portable EXE
    needs: [prepare, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Build single-file executable
        shell: cmd
        run: packaging\build_windows.bat

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item -Path "dist\TimeOverlay.exe" -Destination "artifacts\TimeOverlay-${{ needs.prepare.outputs.new_tag }}-windows-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: artifacts/*.exe
          if-no-files-found: error

  linux:
    name: Linux AppImage
    needs: [prepare, test]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt and AppImage build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libfuse2

      - name: Build AppImage
        run: |
          chmod +x packaging/build_linux.sh packaging/AppRun
          packaging/build_linux.sh

      - name: Stage artifact
        run: |
          mkdir -p artifacts
          cp dist/TimeOverlay-*.AppImage "artifacts/TimeOverlay-${{ needs.prepare.outputs.new_tag }}-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: artifacts/*.AppImage
          if-no-files-found: error

  release:
    name: Create tag and publish release
    needs: [prepare, windows, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create and push tag
        env:
          NEW_TAG: ${{ needs.prepare.outputs.new_tag }}
        run: |
          set -euo pipefail

          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "Checkout is not at the expected commit." >&2
            exit 1
          fi

          remote_line="$(git ls-remote --tags origin "refs/tags/$NEW_TAG" || true)"
          if [ -n "$remote_line" ]; then
            remote_sha="$(echo "$remote_line" | awk '{print $1}')"
            if [ "$remote_sha" != "$GITHUB_SHA" ]; then
              echo "Tag $NEW_TAG already exists at $remote_sha (expected $GITHUB_SHA)." >&2
              exit 1
            fi
            echo "Tag $NEW_TAG already exists at the expected commit; reusing it."
          else
            git tag "$NEW_TAG" "$GITHUB_SHA"
            git push origin "$NEW_TAG"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.new_tag }}
          name: Time Overlay ${{ needs.prepare.outputs.new_tag }}
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
